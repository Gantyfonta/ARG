<!doctype html>
<html><head><meta charset="utf-8"><title>ECHO</title>
<style>
body{background:#07090a;color:#cbd3d5;font:16px monospace;margin:0}main{max-width:800px;margin:8vh auto;padding:25px}
button{background:#11191c;color:#bde9ff;border:1px solid #42606a;padding:12px 18px;font:inherit;cursor:pointer}
#out{margin-top:25px;line-height:1.8}
</style></head><body><main>
<h1>ECHO</h1>
<p>You found the second voice.</p>
<p>It says: <b>“The recording is inside the silence.”</b></p>
<p>There is a hidden audio signal below. It is deliberately almost silent.</p>
<button onclick="play()">PLAY TRANSMISSION</button>
<div id="out"></div>
<script>
function play(){
 const ctx=new (window.AudioContext||window.webkitAudioContext)();
 const o=ctx.createOscillator(), g=ctx.createGain();
 o.type="sine"; o.frequency.value=880; g.gain.value=.015; o.connect(g).connect(ctx.destination);
 o.start(); document.getElementById('out').innerHTML=
 "You heard a tone. That is not the message.<br><br>"+
 "<b>Decode this:</b> 19 20 01 25 / 19 20 01 25 / 05 22 05 18 25";
 setTimeout(()=>o.stop(),1200);
}
</script>
<!-- The intended answer is STAY STAY EVERY. Continue by realizing the phrase is an instruction:
     STAY STAY EVERY = stay on every? The actual hidden instruction is in the repeated pattern:
     19 20 01 25 = STAY, repeated. 05 22 05 18 25 = EVERY.
     Take every repeated word: STAY. "STAY" is the page name. -->
</main></body></html>
